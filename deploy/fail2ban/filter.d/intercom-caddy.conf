# Fallos que cuentan para el baneo (Caddy, log JSON):
#  - 401 (llave inválida) y 403 (origen no permitido) en cualquier ruta, incluidos el login del panel (/web/api/login,
#    /web/api/link) y el canje de invitaciones (/v1/join);
#  - 404 SOLO en rutas que no son del servicio (escaneos). En /mcp, /v1/*, /web y /join un 404 es normal:
#    sesión MCP caducada (el cliente reinicializa) o un hook/vigilante esperando a que su chat conecte.
# No cuentan los 401 de las lecturas del panel sin sesión o con la cookie caducada (el panel deja de consultar y pide
# entrar): una persona que abre el panel varias veces no debe acabar baneada.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":(?:401|403)\b.*$
            ^.*"remote_ip":"<HOST>".*"uri":"(?!/mcp(?:[?"]|$)|/v1/|/web(?:[/?"]|$)|/join(?:[/?"#]|$))[^"]*".*"status":404\b.*$
ignoreregex = ^.*"uri":"/web/api/(?:state|conversation|inbox|channel|task|logout)[^"]*".*"status":401\b.*$
