# Fallos que cuentan para el baneo (Caddy, log JSON):
#  - 401 (llave inválida) y 403 (origen no permitido) en cualquier ruta;
#  - 404 SOLO en rutas que no son del servicio (escaneos). En /mcp y /v1/* un 404 es normal:
#    sesión MCP caducada (el cliente reinicializa) o un hook/vigilante esperando a que su chat conecte.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":(?:401|403)\b.*$
            ^.*"remote_ip":"<HOST>".*"uri":"(?!/mcp(?:[?"]|$)|/v1/)[^"]*".*"status":404\b.*$
ignoreregex =
